[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
markers =
    unit: Testes unitários
    integration: Testes de integração
    performance: Testes de performance
    slow: Testes lentos
asyncio_mode = auto
